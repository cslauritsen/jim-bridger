kind: Secret
apiVersion: v1
metadata:
  name: {{ include "jim-bridger.fullname" . }}
  labels:
    {{- include "jim-bridger.labels" . | nindent 4 }}
data:
  {{- if .Values.preSharedSecret }}
  PRE_SHARED_SECRET: {{ .Values.preSharedSecret | b64enc | quote }}
  {{- end }}
  {{- with .Values.smtp }}
    {{- if .user }}
  SMTP_USER: {{ .user | b64enc | quote }}
    {{- end }}
    {{- if .password }}
  SMTP_PASSWORD: {{ .password | b64enc | quote }}
    {{- end }}
  {{- end }}