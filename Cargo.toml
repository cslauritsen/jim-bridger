[package]
name = "jim_bridger"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"
aws-smithy-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mail-parser = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
